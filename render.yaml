
envVarGroups:
  - name: smart-agri-shared-secrets
    envVars:
      - key: JWT_SECRET
        sync: false

databases:
  - name: smart-agri-db
    databaseName: smart_agri
    user: smart_agri
    plan: free
    region: oregon
    ipAllowList: []

services:
  - type: web
    name: smart-agri-gateway
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /actuator/health
    envVars:
      - key: SERVICE_MODULE
        value: api-gateway
      - key: SERVICE_SCHEME
        value: https
      - key: GATEWAY_RESPONSE_TIMEOUT
        value: 120s
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: AUTH_SERVICE_HOST
        fromService:
          type: web
          name: smart-agri-auth
          property: host
      - key: CROP_SERVICE_HOST
        fromService:
          type: web
          name: smart-agri-crop
          property: host
      - key: FARM_SERVICE_HOST
        fromService:
          type: web
          name: smart-agri-farm
          property: host
      - key: SENSOR_SERVICE_HOST
        fromService:
          type: web
          name: smart-agri-sensor
          property: host
      - key: WEATHER_SERVICE_HOST
        fromService:
          type: web
          name: smart-agri-weather
          property: host
      - key: IRRIGATION_SERVICE_HOST
        fromService:
          type: web
          name: smart-agri-irrigation
          property: host
      - key: FARMER_AGENT_HOST
        fromService:
          type: web
          name: smart-agri-farmer-agent
          property: host

  - type: web
    name: smart-agri-auth
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /actuator/health
    envVars:
      - key: SERVICE_MODULE
        value: auth-service
      - key: DB_HOST
        fromDatabase:
          name: smart-agri-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: smart-agri-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: smart-agri-db
          property: database
      - key: DB_USER
        fromDatabase:
          name: smart-agri-db
          property: user
      - key: POSTGRES_PASSWORD
        fromDatabase:
          name: smart-agri-db
          property: password
      - fromGroup: smart-agri-shared-secrets

  - type: web
    name: smart-agri-crop
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /actuator/health
    envVars:
      - key: SERVICE_MODULE
        value: crop-service
      - fromGroup: smart-agri-shared-secrets
      - key: SPRING_PROFILES_ACTIVE
        value: production
      - key: DB_HOST
        fromDatabase:
          name: smart-agri-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: smart-agri-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: smart-agri-db
          property: database
      - key: DB_USER
        fromDatabase:
          name: smart-agri-db
          property: user
      - key: POSTGRES_PASSWORD
        fromDatabase:
          name: smart-agri-db
          property: password
      - key: SERVICE_SCHEME
        value: https
      - key: FARM_SERVICE_HOST
        fromService:
          type: web
          name: smart-agri-farm
          property: host

  - type: web
    name: smart-agri-farm
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /actuator/health
    envVars:
      - key: SERVICE_MODULE
        value: farm-service
      - fromGroup: smart-agri-shared-secrets

  - type: web
    name: smart-agri-sensor
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /actuator/health
    envVars:
      - key: SERVICE_MODULE
        value: sensor-service
      - fromGroup: smart-agri-shared-secrets
      - key: SPRING_PROFILES_ACTIVE
        value: production
      - key: SERVICE_SCHEME
        value: https
      - key: DB_HOST
        fromDatabase:
          name: smart-agri-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: smart-agri-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: smart-agri-db
          property: database
      - key: DB_USER
        fromDatabase:
          name: smart-agri-db
          property: user
      - key: POSTGRES_PASSWORD
        fromDatabase:
          name: smart-agri-db
          property: password
      - key: DB_POOL_SIZE
        value: "5"
      - key: FARM_SERVICE_HOST
        fromService:
          type: web
          name: smart-agri-farm
          property: host
      - key: CROP_SERVICE_HOST
        fromService:
          type: web
          name: smart-agri-crop
          property: host

  - type: web
    name: smart-agri-weather
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /actuator/health
    envVars:
      - key: SERVICE_MODULE
        value: weather-service

  - type: web
    name: smart-agri-irrigation
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /actuator/health
    envVars:
      - key: SERVICE_MODULE
        value: irrigation-service
      - key: SERVICE_SCHEME
        value: https
      - fromGroup: smart-agri-shared-secrets
      - key: FARM_SERVICE_HOST
        fromService:
          type: web
          name: smart-agri-farm
          property: host
      - key: SENSOR_SERVICE_HOST
        fromService:
          type: web
          name: smart-agri-sensor
          property: host
      - key: WEATHER_SERVICE_HOST
        fromService:
          type: web
          name: smart-agri-weather
          property: host

  - type: web
    name: smart-agri-infrastructure
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /actuator/health
    envVars:
      - key: SERVICE_MODULE
        value: infrastructure-service
      - key: DB_HOST
        fromDatabase:
          name: smart-agri-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: smart-agri-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: smart-agri-db
          property: database
      - key: DB_USER
        fromDatabase:
          name: smart-agri-db
          property: user
      - key: POSTGRES_PASSWORD
        fromDatabase:
          name: smart-agri-db
          property: password

  - type: web
    name: smart-agri-farmer-agent
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /actuator/health
    envVars:
      - key: SERVICE_MODULE
        value: farmer-agent
      - key: SERVICE_SCHEME
        value: https
      - fromGroup: smart-agri-shared-secrets
      - key: DB_HOST
        fromDatabase:
          name: smart-agri-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: smart-agri-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: smart-agri-db
          property: database
      - key: DB_USER
        fromDatabase:
          name: smart-agri-db
          property: user
      - key: POSTGRES_PASSWORD
        fromDatabase:
          name: smart-agri-db
          property: password
      - key: FARM_SERVICE_HOST
        fromService:
          type: web
          name: smart-agri-farm
          property: host
      - key: CROP_SERVICE_HOST
        fromService:
          type: web
          name: smart-agri-crop
          property: host
      - key: SENSOR_SERVICE_HOST
        fromService:
          type: web
          name: smart-agri-sensor
          property: host
      - key: WEATHER_SERVICE_HOST
        fromService:
          type: web
          name: smart-agri-weather
          property: host
      - key: IRRIGATION_SERVICE_HOST
        fromService:
          type: web
          name: smart-agri-irrigation
          property: host
      - key: INFRASTRUCTURE_SERVICE_HOST
        fromService:
          type: web
          name: smart-agri-infrastructure
          property: host

  - type: web
    name: smart-agri-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: smart-agri-gateway
          property: host
      - key: VITE_API_TIMEOUT
        value: "120000"
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
