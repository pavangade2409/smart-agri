server:
  port: ${PORT:8090}

spring:
  application:
    name: farmer-agent

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:smart_agri}
    username: ${DB_USER:postgres}
    password: ${POSTGRES_PASSWORD:}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    show-sql: false

  ai:
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      chat:
        model: qwen3:4b
      embedding:
        model: mxbai-embed-large

    model:
      chat: ollama
      embedding: ollama
      audio:
        speech: none
        transcription: none

    vectorstore:
      pgvector:
        initialize-schema: true
        index-type: HNSW
        distance-type: COSINE_DISTANCE
        dimensions: 1024

    chat:
      memory:
        repository:
          jdbc:
            initialize-schema: always

management:
  endpoints:
    web:
      exposure:
        include: health,info

  endpoint:
    health:
      show-details: always

agri:
  services:
    farm-url: ${SERVICE_SCHEME:http}://${FARM_SERVICE_HOST:localhost:8082}
    crop-url: ${SERVICE_SCHEME:http}://${CROP_SERVICE_HOST:localhost:8085}
    sensor-url: ${SERVICE_SCHEME:http}://${SENSOR_SERVICE_HOST:localhost:8083}
    weather-url: ${SERVICE_SCHEME:http}://${WEATHER_SERVICE_HOST:localhost:8084}
    irrigation-url: ${SERVICE_SCHEME:http}://${IRRIGATION_SERVICE_HOST:localhost:8086}
    infrastructure-url: ${SERVICE_SCHEME:http}://${INFRASTRUCTURE_SERVICE_HOST:localhost:8087}

tavily:
  api-key: ${TAVILY_API_KEY:}
  base-url: https://api.tavily.com