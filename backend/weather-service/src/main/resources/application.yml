
server:
  port: 8084

spring:
  application:
    name: weather-service

weather:
  provider: OPEN_METEO

  base-url: https://api.open-meteo.com

  connect-timeout-seconds: 5

  read-timeout-seconds: 10

  max-retries: 3

management:
  endpoints:
    web:
      exposure:
        include:
          - health
          - info
          - metrics

  endpoint:
    health:
      show-details: always

springdoc:
  api-docs:
    path: /api-docs

  swagger-ui:
    path: /swagger-ui.html
