server:
  port: 8081

spring:

  datasource:
    url: jdbc:h2:file:./data/authdb
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: update

    show-sql: true

    properties:
      hibernate:
        format_sql: true

  h2:
    console:
      enabled: true
      path: /h2-console

  application:
    name: auth-service


jwt:
  secret: ${JWT_SECRET}
  expiration: 86400000


management:
  endpoints:
    web:
      exposure:
        include: health,info