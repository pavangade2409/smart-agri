server:
  port: 8086

spring:

  application:
    name: irrigation-service

  datasource:
    url: jdbc:h2:mem:irrigationdb
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: validate

    open-in-view: false

  h2:
    console:
      enabled: true

  flyway:
    enabled: true

management:

  endpoints:
    web:
      exposure:
        include:
          - health
          - info
          - metrics

  endpoint:
    health:
      show-details: always

springdoc:

  api-docs:
    path: /api-docs

  swagger-ui:
    path: /swagger-ui.html

services:

  weather:
    base-url: http://localhost:8084

  sensor:
    base-url: ${AGRI_SENSOR_SCHEME:http}://${AGRI_SENSOR_HOST:localhost:8083}

  device:
    base-url: http://localhost:8086
